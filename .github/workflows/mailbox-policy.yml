name: Mailbox policy checks
on:
  pull_request:
    paths:
      - "hive/JOIN.md"
      - "hive/FLYWHEEL.md"
      - "hive/AUTOMATION.json"
      - "hive/AUTOMATION.html"
      - "hive/AUTOMATION.md"
      - "hive/RUNNERS.json"
      - "hive/MAILBOX-RELEASE.md"
      - "hive/mailbox-release-proof.schema.json"
      - "hive/THREE-HAT-FOI-GUARDRAILS.md"
      - "tools/validate_mailbox_release.py"
      - "tests/test_validate_mailbox_release.py"
      - ".github/workflows/mailbox-policy.yml"
  push:
    branches: [main]
    paths:
      - "hive/JOIN.md"
      - "hive/FLYWHEEL.md"
      - "hive/AUTOMATION.json"
      - "hive/AUTOMATION.html"
      - "hive/AUTOMATION.md"
      - "hive/RUNNERS.json"
      - "hive/MAILBOX-RELEASE.md"
      - "hive/mailbox-release-proof.schema.json"
      - "hive/THREE-HAT-FOI-GUARDRAILS.md"
      - "tools/validate_mailbox_release.py"
      - "tests/test_validate_mailbox_release.py"
      - ".github/workflows/mailbox-policy.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mailbox-release gate tests
        run: python -m unittest discover -s tests -v
      - name: Check policy version consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          join = Path("hive/JOIN.md").read_text(encoding="utf-8")
          flywheel = Path("hive/FLYWHEEL.md").read_text(encoding="utf-8")
          automation = json.loads(Path("hive/AUTOMATION.json").read_text(encoding="utf-8"))
          html = Path("hive/AUTOMATION.html").read_text(encoding="utf-8")
          assert "v3.31.3" in join and "v3.31.3" in flywheel and "v3.31.3" in html
          assert automation["joinContract"]["version"] == "3.31.3"
          assert automation["version"] == "1.1.5"
          assert "schedule_send_supported" in Path("hive/mailbox-release-proof.schema.json").read_text(encoding="utf-8")
          assert "There is no daily draft-volume cap." in Path("hive/MAILBOX-RELEASE.md").read_text(encoding="utf-8")
          assert "two complete review rounds" in automation["guardrails"][-1]
          email_gate = next(x for x in automation["defaultRules"] if x["id"] == "email-gate")
          assert "two sequential complete review rounds" in email_gate["then"][1]
          assert any("48 elapsed hours" in x for x in email_gate["then"])
          assert not any("five drafts" in x.lower() or "at five" in x.lower() for x in email_gate["then"])
          assert automation["joinContract"]["sourceNote"].startswith("Version reflects the repository fallback")
          PY
